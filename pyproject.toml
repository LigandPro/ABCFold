[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abcfold"
version = "2.0.0"
description = "Run and compare AlphaFold3, Boltz, Chai-1, OpenFold3, Protenix and RosettaFold3 on one input"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD License" }
authors = [
    { name = "Adam Simpkin", email = "hlasimpk@liverpool.ac.uk" },
    { name = "Luc Elliott", email = "hllelli2@liverpool.ac.uk" },
    { name = "LigandPro" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26,<3",
    "colorama",
    "tqdm",
    "biopython>=1.84",
    "requests",
    "pandas>=2.2",
    "plotly",
    "jinja2",
    "pyarrow>=19",
    "packaging",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
lint = ["ruff"]
test = ["pytest", "pytest-cov"]
dev = ["ruff", "pytest", "pytest-cov", "pre-commit", "mypy", "types-requests"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[project.urls]
homepage = "https://github.com/LigandPro/ABCFold"
upstream = "https://github.com/rigdenlab/ABCFold"

[project.scripts]
abcfold = "abcfold.cli:main"
boltz-affinity = "abcfold.boltz.score_existing:main"
boltz-dock = "abcfold.boltz.dock_crystal:main"
mmseqs2msa = "abcfold.scripts.add_mmseqs_msa:main"
custom_templates = "abcfold.scripts.add_custom_template:main"
ipsae = "abcfold.scripts.ipsae:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abcfold*"]

[tool.setuptools.package-data]
abcfold = [
    "backends.toml",
    "data/*",
    "LICENCE",
    "html/*",
    "html/**/*",
    "plots/pae-viewer-main/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a GPU and the backend environments (deselected by default)",
]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["abcfold.scripts.ipsae", "abcfold.scripts.add_mmseqs_msa", "tests.conftest"]
ignore_errors = true
